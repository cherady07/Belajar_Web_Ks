<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Ide Menu - Sweet Chil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <header class="dashboard-navbar">
      <p class="login-logo">🍡 Sweet Chil - Admin</p>
      <nav class="dashboard-nav-links">
        <a href="{{ url_for('dashboard') }}">Kelola Menu</a>
        <a href="{{ url_for('kelola_pesanan') }}">Pesanan Custom</a>
        <a href="{{ url_for('daftar_harga') }}">Daftar Harga</a>
        <div class="nav-dropdown">
          <span class="nav-dropdown-toggle">Kalkulasi HPP ▾</span>
          <div class="nav-dropdown-menu">
            <a href="{{ url_for('hpp') }}">HPP</a>
            <a href="{{ url_for('bahan_baku') }}">Bahan Baku</a>
            <a href="{{ url_for('resep') }}">Resep</a>
          </div>
        </div>
        <div class="nav-dropdown">
          <span class="nav-dropdown-toggle">Promosi ▾</span>
          <div class="nav-dropdown-menu">
            <a href="{{ url_for('diskon') }}">Diskon</a>
            <a href="{{ url_for('pengumuman') }}">Pengumuman</a>
            <a href="{{ url_for('ide_menu') }}">Ide Menu</a>
          </div>
        </div>
      </nav>
      <a href="{{ url_for('ide_menu') }}" class="btn-cta btn-logout">Kembali</a>
    </header>

    <main class="dashboard-content">
      <div class="dashboard-form">
        <h2>Tambah Ide Menu</h2>
        <form
          method="POST"
          enctype="multipart/form-data"
          class="dashboard-form"
        >
          <div class="form-group">
            <label for="nama_ide">Nama Ide Menu</label>
            <input
              type="text"
              id="nama_ide"
              name="nama_ide"
              placeholder="Contoh: Donat Custom Topping"
              required
            />
          </div>

          <div class="form-group">
            <label for="deskripsi">Deskripsi</label>
            <textarea
              id="deskripsi"
              name="deskripsi"
              rows="4"
              placeholder="Ceritain detail ide dari customer..."
            ></textarea>
          </div>

          <div class="form-group">
            <label for="foto">Foto Percobaan</label>
            <input type="file" id="foto" name="foto" accept="image/*" />
          </div>

          <div class="form-group form-checkbox">
            <label>
              <input type="checkbox" id="status_tampil" name="status_tampil" />
              Tampilkan di landing page sekarang
            </label>
          </div>

          <button type="submit" class="login-btn">Simpan Ide</button>
        </form>
      </div>
    </main>
  </body>
</html>
