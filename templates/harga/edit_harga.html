<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Harga - Sweet Chil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <header class="dashboard-navbar">
      <p class="login-logo">🍡 Sweet Chil - Admin</p>
      <a href="{{ url_for('daftar_harga') }}" class="btn-cta btn-logout"
        >Kembali</a
      >
    </header>

    <main class="dashboard-content">
      <div class="dashboard-form">
        <h2>Edit Harga: {{ item['jenis_kue'] }}</h2>
        <form method="POST">
          <div class="form-group">
            <label for="jenis_kue">Jenis Kue</label>
            <input
              type="text"
              id="jenis_kue"
              name="jenis_kue"
              value="{{ item['jenis_kue'] }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="ukuran">Ukuran</label>
            <input
              type="text"
              id="ukuran"
              name="ukuran"
              value="{{ item['ukuran'] }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="harga">Harga (Rp)</label>
            <input
              type="number"
              id="harga"
              name="harga"
              value="{{ item['harga'] }}"
              required
            />
          </div>

          <button type="submit" class="login-btn">Update</button>
        </form>
      </div>
    </main>
  </body>
</html>
