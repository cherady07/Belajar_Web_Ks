<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Menu - Sweet Chil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <header class="dashboard-navbar">
      <p class="login-logo">🍡 Sweet Chil - Admin</p>
      <a href="{{ url_for('dashboard') }}" class="btn-cta btn-logout"
        >Kembali</a
      >
      <nav class="dashboard-nav-links">
        <a
          href="{{ url_for('dashboard') }}"
          class="{{ 'active' if request.endpoint == 'dashboard' }}"
          >Kelola Menu</a
        >
        <a
          href="{{ url_for('kelola_pesanan') }}"
          class="{{ 'active' if request.endpoint == 'kelola_pesanan' }}"
          >Pesanan Custom</a
        >
        <a
          href="{{ url_for('daftar_harga') }}"
          class="{{ 'active' if request.endpoint == 'daftar_harga' }}"
          >Daftar Harga</a
        >
      </nav>
    </header>

    <main class="dashboard-content">
      <h2>Edit Menu: {{ item['nama'] }}</h2>

      <div class="edit-menu-layout">
        <form
          method="POST"
          enctype="multipart/form-data"
          class="dashboard-form"
        >
          <div class="form-group">
            <label for="nama">Nama Menu</label>
            <input
              type="text"
              id="nama"
              name="nama"
              value="{{ item['nama'] }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="harga">Harga (Rp)</label>
            <input
              type="number"
              id="harga"
              name="harga"
              value="{{ item['harga'] }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="stok">Stok</label>
            <input
              type="number"
              id="stok"
              name="stok"
              value="{{ item['stok'] }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="kategori">Kategori</label>
            <input
              type="text"
              id="kategori"
              name="kategori"
              value="{{ item['kategori'] }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="foto"
              >Ganti Foto (kosongkan kalau tidak ingin ganti)</label
            >
            <input type="file" id="foto" name="foto" accept="image/*" />
          </div>

          <button type="submit" class="login-btn">Update Menu</button>
        </form>

        <div class="photo-preview-card">
          <p class="photo-preview-label">Foto Saat Ini</p>
          <img
            src="{{ url_for('static', filename='images/menu/' + item['foto']) }}"
            alt="{{ item['nama'] }}"
          />
        </div>
      </div>
    </main>
  </body>
</html>
