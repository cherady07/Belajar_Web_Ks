<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Menu - Sweet Chil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <header class="dashboard-navbar">
      <p class="login-logo">🍡 Sweet Chil - Admin</p>

      <nav class="dashboard-nav-links">
        <a
          href="{{ url_for('dashboard') }}"
          class="{{ 'active' if request.endpoint == 'dashboard' }}"
          >Kelola Menu</a
        >
        <a
          href="{{ url_for('kelola_pesanan') }}"
          class="{{ 'active' if request.endpoint == 'kelola_pesanan' }}"
          >Pesanan Custom</a
        >
        <a
          href="{{ url_for('daftar_harga') }}"
          class="{{ 'active' if request.endpoint == 'daftar_harga' }}"
          >Daftar Harga</a
        >

        <div class="nav-dropdown">
          <span class="nav-dropdown-toggle">Kalkulasi HPP ▾</span>
          <div class="nav-dropdown-menu">
            <a href="{{ url_for('hpp') }}">HPP</a>
            <a href="{{ url_for('bahan_baku') }}">Bahan Baku</a>
            <a href="{{ url_for('resep') }}">Resep</a>
          </div>
        </div>
        <div class="nav-dropdown">
          <span class="nav-dropdown-toggle">Promosi ▾</span>
          <div class="nav-dropdown-menu">
            <a href="{{ url_for('diskon') }}">Diskon</a>
            <a href="{{ url_for('pengumuman') }}">Pengumuman</a>
          </div>
        </div>
      </nav>
      <a href="{{ url_for('dashboard') }}" class="btn-cta btn-logout"
        >Kembali</a
      >
    </header>

    <main class="dashboard-content">
      <h2>Tambah Menu Baru</h2>

      <form method="POST" enctype="multipart/form-data" class="dashboard-form">
        <div class="form-group">
          <label for="nama">Nama Menu</label>
          <input type="text" id="nama" name="nama" required />
        </div>

        <div class="form-group">
          <label for="harga">Harga (Rp)</label>
          <input type="number" id="harga" name="harga" required />
        </div>

        <div class="form-group">
          <label for="stok">Stok</label>
          <input type="number" id="stok" name="stok" required />
        </div>

        <div class="form-group">
          <label for="kategori">Kategori</label>
          <input type="text" id="kategori" name="kategori" required />
        </div>

        <div class="form-group">
          <label for="foto">Foto Menu</label>
          <input type="file" id="foto" name="foto" accept="image/*" required />
        </div>

        <button type="submit" class="login-btn">Simpan Menu</button>
      </form>
    </main>
  </body>
</html>
