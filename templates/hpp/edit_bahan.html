<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Bahan - Sweet Chil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <header class="dashboard-navbar">
      <p class="login-logo">🍡 Sweet Chil - Admin</p>
      <nav class="dashboard-nav-links">
        <a
          href="{{ url_for('dashboard') }}"
          class="{{ 'active' if request.endpoint == 'dashboard' }}"
          >Kelola Menu</a
        >
        <a
          href="{{ url_for('kelola_pesanan') }}"
          class="{{ 'active' if request.endpoint == 'kelola_pesanan' }}"
          >Pesanan Custom</a
        >
        <a
          href="{{ url_for('daftar_harga') }}"
          class="{{ 'active' if request.endpoint == 'daftar_harga' }}"
          >Daftar Harga</a
        >

        <div class="nav-dropdown">
          <span class="nav-dropdown-toggle">Kalkulasi HPP ▾</span>
          <div class="nav-dropdown-menu">
            <a href="{{ url_for('hpp') }}">HPP</a>
            <a href="{{ url_for('bahan_baku') }}">Bahan Baku</a>
            <a href="{{ url_for('resep') }}">Resep</a>
          </div>
        </div>
        <div class="nav-dropdown">
          <span class="nav-dropdown-toggle">Promosi ▾</span>
          <div class="nav-dropdown-menu">
            <a href="{{ url_for('diskon') }}">Diskon</a>
            <a href="{{ url_for('pengumuman') }}">Pengumuman</a>
          </div>
        </div>
      </nav>
      <a href="{{ url_for('bahan_baku') }}" class="btn-cta btn-logout"
        >Kembali</a
      >
    </header>

    <main class="dashboard-content">
      <div class="dashboard-form">
        <h2>Edit Bahan: {{ item['nama'] }}</h2>
        <form method="POST">
          <div class="form-group">
            <label for="nama">Nama Bahan</label>
            <input
              type="text"
              id="nama"
              name="nama"
              value="{{ item['nama'] }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="harga_per_satuan">Harga per Satuan (Rp)</label>
            <input
              type="number"
              id="harga_per_satuan"
              name="harga_per_satuan"
              value="{{ item['harga_per_satuan'] }}"
              required
            />
          </div>

          <div class="form-group">
            <label for="satuan">Satuan</label>
            <input
              type="text"
              id="satuan"
              name="satuan"
              value="{{ item['satuan'] }}"
              required
            />
          </div>

          <button type="submit" class="login-btn">Update</button>
        </form>
      </div>
    </main>
  </body>
</html>
