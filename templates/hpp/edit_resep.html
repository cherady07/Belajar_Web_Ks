<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Resep - Sweet Chil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="dashboard-page">
    <header class="dashboard-navbar">
        <p class="login-logo">🍡 Sweet Chil - Admin</p>
        <a href="{{ url_for('resep') }}" class="btn-cta btn-logout">Kembali</a>
    </header>

    <main class="dashboard-content">
        <div class="dashboard-form">
            <h2>Edit Resep</h2>
            <form method="POST">
                <div class="form-group">
                    <label for="menu_id">Pilih Menu</label>
                    <select id="menu_id" name="menu_id" required>
                        {% for m in daftar_menu %}
                        <option value="{{ m['id'] }}" {{ 'selected' if m['id'] == item['menu_id'] }}>{{ m['nama'] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="bahan_baku_id">Pilih Bahan</label>
                    <select id="bahan_baku_id" name="bahan_baku_id" required>
                        {% for b in daftar_bahan %}
                        <option value="{{ b['id'] }}" {{ 'selected' if b['id'] == item['bahan_baku_id'] }}>{{ b['nama'] }} ({{ b['satuan'] }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="jumlah_dipakai">Jumlah Dipakai</label>
                    <input type="number" step="0.01" id="jumlah_dipakai" name="jumlah_dipakai" value="{{ item['jumlah_dipakai'] }}" required>
                </div>

                <button type="submit" class="login-btn">Update Resep</button>
            </form>
        </div>
    </main>
</body>
</html>
