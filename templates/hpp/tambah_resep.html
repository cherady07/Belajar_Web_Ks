<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Resep - Sweet Chil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <header class="dashboard-navbar">
      <p class="login-logo">🍡 Sweet Chil - Admin</p>
      <nav class="dashboard-nav-links">
        <a
          href="{{ url_for('dashboard') }}"
          class="{{ 'active' if request.endpoint == 'dashboard' }}"
          >Kelola Menu</a
        >
        <a
          href="{{ url_for('kelola_pesanan') }}"
          class="{{ 'active' if request.endpoint == 'kelola_pesanan' }}"
          >Pesanan Custom</a
        >
        <a
          href="{{ url_for('daftar_harga') }}"
          class="{{ 'active' if request.endpoint == 'daftar_harga' }}"
          >Daftar Harga</a
        >

        <div class="nav-dropdown">
          <span class="nav-dropdown-toggle">Kalkulasi HPP ▾</span>
          <div class="nav-dropdown-menu">
            <a href="{{ url_for('hpp') }}">HPP</a>
            <a href="{{ url_for('bahan_baku') }}">Bahan Baku</a>
            <a href="{{ url_for('resep') }}">Resep</a>
          </div>
        </div>
      </nav>
      <a href="{{ url_for('resep') }}" class="btn-cta btn-logout">Kembali</a>
    </header>

    <main class="dashboard-content">
      <div class="dashboard-form">
        <h2>Tambah Resep Baru</h2>
        <form method="POST">
          <div class="form-group">
            <label for="menu_id">Pilih Menu</label>
            <select id="menu_id" name="menu_id" required>
              {% for m in daftar_menu %}
              <option value="{{ m['id'] }}">{{ m['nama'] }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label for="bahan_baku_id">Pilih Bahan</label>
            <select id="bahan_baku_id" name="bahan_baku_id" required>
              {% for b in daftar_bahan %}
              <option value="{{ b['id'] }}">
                {{ b['nama'] }} ({{ b['satuan'] }})
              </option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label for="jumlah_dipakai">Jumlah Dipakai</label>
            <input
              type="number"
              step="0.01"
              id="jumlah_dipakai"
              name="jumlah_dipakai"
              placeholder="Contoh: 0.05"
              required
            />
          </div>

          <button type="submit" class="login-btn">Simpan Resep</button>
        </form>
      </div>
    </main>
  </body>
</html>
